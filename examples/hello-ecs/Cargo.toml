[package]
name = "hello-ecs"
description = "The smallest wasmcart-bevy cart: Bevy ECS, gamepad and audio, drawn into the 2D framebuffer without a GPU"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy = { workspace = true, features = ["std"] }
wasmcart-bevy = { workspace = true }
